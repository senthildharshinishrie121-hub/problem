<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Predictor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>📅 Attendance Predictor</h1>
    <p>Plan your leaves without falling into detention.</p>
  </header>

  <main>
    <section class="panel controls">
      <label>Section
        <select id="section"></select>
      </label>
      <label>Target %
        <select id="target">
          <option value="75">75% (detention limit)</option>
          <option value="80">80%</option>
          <option value="85">85%</option>
          <option value="90">90% (safe zone)</option>
        </select>
      </label>
      <label>As of date
        <input type="date" id="asof">
      </label>
    </section>

    <section id="overall" class="panel"></section>

    <section class="panel">
      <h2>Plan leaves</h2>
      <div class="controls">
        <label>From <input type="date" id="leaveFrom"></label>
        <label>To <input type="date" id="leaveTo"></label>
        <button id="addLeave">Add leave</button>
        <button id="clearLeaves" class="ghost">Clear all</button>
      </div>
      <div id="chips" class="chips"></div>
    </section>

    <section id="subjects" class="grid"></section>
  </main>

  <footer>Enter the attended / conducted numbers from your college portal in each card.
    Data stays in your browser.</footer>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
